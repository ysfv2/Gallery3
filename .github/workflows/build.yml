name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p www native scripts
          mv -f index.html style.css app.js demo.js www/ 2>/dev/null || true
          mv -f MediaLibraryPlugin.java MediaWebViewClient.java MainActivity.java ic_launcher_foreground.xml native/ 2>/dev/null || true
          mv -f setup-android.py scripts/ 2>/dev/null || true
      - run: npm install --no-audit --no-fund
      - run: |
          npx cap add android
          python3 scripts/setup-android.py
          npx cap sync android
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
